[package]
name = "rust_browser"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
pixels = "0.15"
fontdue = "0.9.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rodio = "0.20"
boa_engine = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
